<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310" width="580" height="310" role="img" aria-labelledby="aegisTitle aegisDesc">
  <title id="aegisTitle">Aegis LLM Security Gateway and Privacy Firewall</title>
  <desc id="aegisDesc">Animated product card illustrating Aegis LLM Security Gateway inspecting ingress prompts and redacting PII before reaching downstream LLM providers.</desc>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

    @keyframes flowDash {
      0% { stroke-dashoffset: 28; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes packetSlide {
      0% { transform: translateX(0px); opacity: 0; }
      10% { opacity: 1; }
      45% { transform: translateX(176px); opacity: 1; }
      55% { transform: translateX(202px); opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateX(358px); opacity: 0; }
    }

    @keyframes shieldBreath {
      0%, 100% { stroke-opacity: 0.45; }
      50% { stroke-opacity: 1; }
    }

    .pipe-dash {
      stroke-dasharray: 5 9;
      animation: flowDash 1.5s linear infinite;
    }

    .data-dot {
      animation: packetSlide 3.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .shield-box {
      animation: shieldBreath 2.6s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .pipe-dash, .data-dot, .shield-box { animation: none; }
      .data-dot { opacity: 1; }
    }
  </style>

  <!-- Card Shell -->
  <rect x="1" y="1" width="578" height="308" rx="16" fill="#090D16" stroke="#1E293B" stroke-width="1.5" />
  <line x1="16" y1="2" x2="564" y2="2" stroke="#F8FAFC" stroke-opacity="0.06" stroke-width="1" />

  <!-- Top Row -->
  <text x="24" y="34" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#10B981">
    03 · LLM SECURITY GATEWAY
  </text>
  <rect x="462" y="18" width="94" height="24" rx="6" fill="#0F1623" stroke="#283548" stroke-width="1" />
  <text x="509" y="34" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#CBD5E1">OPEN REPO &#x2197;</text>

  <!-- Title & Description -->
  <text x="24" y="64" class="sans" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">
    Aegis Privacy Firewall
  </text>
  <text x="24" y="84" class="sans" font-size="12.5" fill="#94A3B8">
    Reverse Proxy Blocking Prompt Injection, Jailbreaks &amp; PII Leakage
  </text>

  <!-- Miniature Pipeline UI -->
  <rect x="24" y="100" width="532" height="150" rx="10" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
  <line x1="24" y1="122" x2="556" y2="122" stroke="#1E293B" stroke-width="1" />
  <circle cx="38" cy="111" r="3" fill="#334155" />
  <circle cx="49" cy="111" r="3" fill="#334155" />
  <circle cx="60" cy="111" r="3" fill="#334155" />
  <text x="76" y="114" class="mono" font-size="10" fill="#64748B">aegis / ingress-policy-engine</text>
  <text x="542" y="114" text-anchor="end" class="mono" font-size="9.5" fill="#34D399">FAIL-CLOSED</text>

  <!-- Horizontal Animated Spine -->
  <line x1="154" y1="170" x2="426" y2="170" stroke="#1E293B" stroke-width="2" />
  <line x1="154" y1="170" x2="426" y2="170" stroke="#10B981" stroke-width="2" stroke-opacity="0.7" class="pipe-dash" />
  <circle cx="110" cy="170" r="4" fill="#34D399" class="data-dot" />

  <!-- Node 1: Client / Agent -->
  <rect x="38" y="140" width="122" height="60" rx="8" fill="#090D16" stroke="#283548" stroke-width="1" />
  <text x="99" y="164" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#94A3B8">CLIENT / AGENT</text>
  <text x="99" y="182" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Ingress Prompt</text>

  <!-- Node 2: Aegis Gate -->
  <rect x="206" y="136" width="168" height="68" rx="9" fill="#090D16" stroke="#10B981" stroke-width="1.3" class="shield-box" />
  <text x="290" y="158" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#10B981">AEGIS POLICY GATE</text>
  <text x="290" y="177" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#F8FAFC">PII Redact &amp; Guard</text>
  <text x="290" y="193" text-anchor="middle" class="mono" font-size="9" fill="#64748B">Injection Check</text>

  <!-- Node 3: Downstream LLM -->
  <rect x="420" y="140" width="122" height="60" rx="8" fill="#090D16" stroke="#283548" stroke-width="1" />
  <text x="481" y="164" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#38BDF8">LLM PROVIDER</text>
  <text x="481" y="182" text-anchor="middle" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F0">OpenAI · Gemini</text>

  <!-- Bottom Policy Log Bar -->
  <rect x="38" y="214" width="504" height="24" rx="5" fill="#090D16" stroke="#1E293B" stroke-width="1" />
  <text x="50" y="230" class="mono" font-size="9.5" fill="#94A3B8">
    <tspan fill="#10B981">[GUARD]</tspan> ingress sanitized · PII redacted · zero unauthorized tool calls
  </text>

  <!-- Bottom Tech Pills -->
  <g>
    <rect x="24" y="268" width="70" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="59" y="284" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">Python</text>

    <rect x="102" y="268" width="110" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="157" y="284" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">Reverse Proxy</text>

    <rect x="220" y="268" width="90" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="265" y="284" text-anchor="middle" class="mono" font-size="10" fill="#34D399">DevSecOps</text>

    <rect x="318" y="268" width="68" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="352" y="284" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">Docker</text>
  </g>
</svg>
