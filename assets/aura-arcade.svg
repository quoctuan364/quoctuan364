<svg xmlns="http://www.w3.org/2000/svg" width="860" height="145" viewBox="0 0 860 145" role="img" aria-label="Aura Pac-Man Bug Hunter Arcade">
  <style>
    .pac-runner { animation: pacMove 9s linear infinite; }
    .ghost-1 { animation: ghostBob 1.1s ease-in-out infinite alternate; }
    .ghost-2 { animation: ghostBob 1.1s ease-in-out 0.4s infinite alternate; }
    .ghost-3 { animation: ghostBob 1.1s ease-in-out 0.8s infinite alternate; }
    .pellet { animation: pelletPulse 1.8s ease-in-out infinite; }
    .laser-border { stroke-dasharray: 120 40; animation: borderRun 6s linear infinite; }

    @keyframes pacMove {
      0% { transform: translateX(0px); }
      100% { transform: translateX(620px); }
    }
    @keyframes ghostBob {
      0% { transform: translateY(-4px); }
      100% { transform: translateY(4px); }
    }
    @keyframes pelletPulse {
      0%, 100% { opacity: 0.35; r: 3.5px; }
      50% { opacity: 1; r: 5px; }
    }
    @keyframes borderRun {
      from { stroke-dashoffset: 320; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <rect width="860" height="145" rx="16" fill="#0d0b18" stroke="#2e264d" stroke-width="1.5"/>

  <!-- Neon Maze Track Walls -->
  <line x1="28" y1="48" x2="832" y2="48" stroke="#a277ff" stroke-width="2.5" class="laser-border"/>
  <line x1="28" y1="114" x2="832" y2="114" stroke="#61ffca" stroke-width="2.5" class="laser-border"/>

  <!-- Top Arcade Scoreboard -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700">
    <text x="32" y="30" fill="#ffca85">ARCADE // BUG HUNTER STAGE 01</text>
    <text x="380" y="30" fill="#61ffca">HIGH SCORE: 999,420 PTS</text>
    <text x="675" y="30" fill="#f694ff">TARGET: ZERO RUNTIME BUGS</text>
  </g>

  <!-- Glowing Bug Pellets Along Track -->
  <g fill="#ffca85">
    <circle cx="150" cy="81" r="4" class="pellet"/>
    <circle cx="205" cy="81" r="4" class="pellet"/>
    <circle cx="260" cy="81" r="4" class="pellet"/>
    <circle cx="315" cy="81" r="4" class="pellet"/>
    <circle cx="370" cy="81" r="4" class="pellet"/>
    <circle cx="425" cy="81" r="4" class="pellet"/>
    <circle cx="480" cy="81" r="4" class="pellet"/>
    <circle cx="535" cy="81" r="4" class="pellet"/>
  </g>

  <!-- Code Bug Tags Being Chased -->
  <g transform="translate(590, 65)">
    <g class="ghost-1">
      <path d="M 0 28 L 0 12 A 14 14 0 0 1 28 12 L 28 28 L 23 23 L 18 28 L 14 23 L 9 28 L 4 23 Z" fill="#ff6767"/>
      <circle cx="9" cy="12" r="3" fill="#ffffff"/><circle cx="10" cy="12" r="1.5" fill="#0d0b18"/>
      <circle cx="19" cy="12" r="3" fill="#ffffff"/><circle cx="20" cy="12" r="1.5" fill="#0d0b18"/>
      <text x="-4" y="40" fill="#ff6767" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700">NullPtr</text>
    </g>
  </g>

  <g transform="translate(665, 65)">
    <g class="ghost-2">
      <path d="M 0 28 L 0 12 A 14 14 0 0 1 28 12 L 28 28 L 23 23 L 18 28 L 14 23 L 9 28 L 4 23 Z" fill="#f694ff"/>
      <circle cx="9" cy="12" r="3" fill="#ffffff"/><circle cx="10" cy="12" r="1.5" fill="#0d0b18"/>
      <circle cx="19" cy="12" r="3" fill="#ffffff"/><circle cx="20" cy="12" r="1.5" fill="#0d0b18"/>
      <text x="-6" y="40" fill="#f694ff" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700">MemLeak</text>
    </g>
  </g>

  <g transform="translate(740, 65)">
    <g class="ghost-3">
      <path d="M 0 28 L 0 12 A 14 14 0 0 1 28 12 L 28 28 L 23 23 L 18 28 L 14 23 L 9 28 L 4 23 Z" fill="#61ffca"/>
      <circle cx="9" cy="12" r="3" fill="#ffffff"/><circle cx="10" cy="12" r="1.5" fill="#0d0b18"/>
      <circle cx="19" cy="12" r="3" fill="#ffffff"/><circle cx="20" cy="12" r="1.5" fill="#0d0b18"/>
      <text x="-4" y="40" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700">TechDebt</text>
    </g>
  </g>

  <!-- Animated Pac-Man Chasing Bugs -->
  <g transform="translate(65, 81)">
    <g class="pac-runner">
      <path d="M 0 0 L 16 -11 A 19 19 0 1 0 16 11 Z" fill="#ffca85"/>
      <circle cx="2" cy="-9" r="2.5" fill="#0d0b18"/>
    </g>
  </g>
</svg>