<svg xmlns="http://www.w3.org/2000/svg" width="860" height="150" viewBox="0 0 860 150" role="img" aria-label="Aura Pac-Man Bug Hunter Arcade">
  <style>
    .pac-runner { animation: pacMove 8s linear infinite; }
    .jaw-top { animation: chompTop 0.22s ease-in-out infinite alternate; transform-origin: 0px 0px; }
    .jaw-bot { animation: chompBot 0.22s ease-in-out infinite alternate; transform-origin: 0px 0px; }
    .laser-border { stroke-dasharray: 120 40; animation: borderRun 5s linear infinite; }

    @keyframes pacMove {
      0% { transform: translateX(0px); opacity: 1; }
      88% { transform: translateX(695px); opacity: 1; }
      91% { transform: translateX(705px); opacity: 0; }
      95% { transform: translateX(0px); opacity: 0; }
      100% { transform: translateX(0px); opacity: 1; }
    }
    @keyframes chompTop {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-28deg); }
    }
    @keyframes chompBot {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(28deg); }
    }
    @keyframes borderRun {
      from { stroke-dashoffset: 320; }
      to { stroke-dashoffset: 0; }
    }
    
    @keyframes eatPellet0 {
      0%, 7% { opacity: 1; transform: scale(1); }
      9%, 92% { opacity: 0; transform: scale(0); }
      96%, 100% { opacity: 1; transform: scale(1); }
    }
    .pellet-0 {
      animation: eatPellet0 8s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes eatPellet1 {
      0%, 14% { opacity: 1; transform: scale(1); }
      16%, 92% { opacity: 0; transform: scale(0); }
      96%, 100% { opacity: 1; transform: scale(1); }
    }
    .pellet-1 {
      animation: eatPellet1 8s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes eatPellet2 {
      0%, 22% { opacity: 1; transform: scale(1); }
      24%, 92% { opacity: 0; transform: scale(0); }
      96%, 100% { opacity: 1; transform: scale(1); }
    }
    .pellet-2 {
      animation: eatPellet2 8s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes eatPellet3 {
      0%, 29% { opacity: 1; transform: scale(1); }
      31%, 92% { opacity: 0; transform: scale(0); }
      96%, 100% { opacity: 1; transform: scale(1); }
    }
    .pellet-3 {
      animation: eatPellet3 8s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes eatPellet4 {
      0%, 37% { opacity: 1; transform: scale(1); }
      39%, 92% { opacity: 0; transform: scale(0); }
      96%, 100% { opacity: 1; transform: scale(1); }
    }
    .pellet-4 {
      animation: eatPellet4 8s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes eatPellet5 {
      0%, 44% { opacity: 1; transform: scale(1); }
      46%, 92% { opacity: 0; transform: scale(0); }
      96%, 100% { opacity: 1; transform: scale(1); }
    }
    .pellet-5 {
      animation: eatPellet5 8s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes eatPellet6 {
      0%, 52% { opacity: 1; transform: scale(1); }
      54%, 92% { opacity: 0; transform: scale(0); }
      96%, 100% { opacity: 1; transform: scale(1); }
    }
    .pellet-6 {
      animation: eatPellet6 8s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes eatPellet7 {
      0%, 59% { opacity: 1; transform: scale(1); }
      61%, 92% { opacity: 0; transform: scale(0); }
      96%, 100% { opacity: 1; transform: scale(1); }
    }
    .pellet-7 {
      animation: eatPellet7 8s linear infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    
    @keyframes eatGhost0 {
      0%, 65% { opacity: 1; transform: translateY(0) scale(1); }
      67%, 92% { opacity: 0; transform: translateY(-10px) scale(0.2); }
      96%, 100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popScore0 {
      0%, 66% { opacity: 0; transform: translateY(5px); }
      67%, 75% { opacity: 1; transform: translateY(-12px); }
      77%, 100% { opacity: 0; transform: translateY(-18px); }
    }
    .ghost-wrap-0 { animation: eatGhost0 8s linear infinite; transform-box: fill-box; transform-origin: center; }
    .pop-score-0 { animation: popScore0 8s linear infinite; }
    @keyframes eatGhost1 {
      0%, 73% { opacity: 1; transform: translateY(0) scale(1); }
      75%, 92% { opacity: 0; transform: translateY(-10px) scale(0.2); }
      96%, 100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popScore1 {
      0%, 74% { opacity: 0; transform: translateY(5px); }
      75%, 83% { opacity: 1; transform: translateY(-12px); }
      85%, 100% { opacity: 0; transform: translateY(-18px); }
    }
    .ghost-wrap-1 { animation: eatGhost1 8s linear infinite; transform-box: fill-box; transform-origin: center; }
    .pop-score-1 { animation: popScore1 8s linear infinite; }
    @keyframes eatGhost2 {
      0%, 81% { opacity: 1; transform: translateY(0) scale(1); }
      83%, 92% { opacity: 0; transform: translateY(-10px) scale(0.2); }
      96%, 100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes popScore2 {
      0%, 82% { opacity: 0; transform: translateY(5px); }
      83%, 91% { opacity: 1; transform: translateY(-12px); }
      93%, 100% { opacity: 0; transform: translateY(-18px); }
    }
    .ghost-wrap-2 { animation: eatGhost2 8s linear infinite; transform-box: fill-box; transform-origin: center; }
    .pop-score-2 { animation: popScore2 8s linear infinite; }
    
    @keyframes scoreStep0 {
      0%, 0% { opacity: 0; }
      0%, 10.5% { opacity: 1; }
      11%, 100% { opacity: 0; }
    }
    .score-frame-0 { animation: scoreStep0 8s step-end infinite; }
    @keyframes scoreStep1 {
      0%, 10.5% { opacity: 0; }
      11%, 21.5% { opacity: 1; }
      22%, 100% { opacity: 0; }
    }
    .score-frame-1 { animation: scoreStep1 8s step-end infinite; }
    @keyframes scoreStep2 {
      0%, 21.5% { opacity: 0; }
      22%, 32.5% { opacity: 1; }
      33%, 100% { opacity: 0; }
    }
    .score-frame-2 { animation: scoreStep2 8s step-end infinite; }
    @keyframes scoreStep3 {
      0%, 32.5% { opacity: 0; }
      33%, 43.5% { opacity: 1; }
      44%, 100% { opacity: 0; }
    }
    .score-frame-3 { animation: scoreStep3 8s step-end infinite; }
    @keyframes scoreStep4 {
      0%, 43.5% { opacity: 0; }
      44%, 54.5% { opacity: 1; }
      55%, 100% { opacity: 0; }
    }
    .score-frame-4 { animation: scoreStep4 8s step-end infinite; }
    @keyframes scoreStep5 {
      0%, 54.5% { opacity: 0; }
      55%, 65.5% { opacity: 1; }
      66%, 100% { opacity: 0; }
    }
    .score-frame-5 { animation: scoreStep5 8s step-end infinite; }
    @keyframes scoreStep6 {
      0%, 65.5% { opacity: 0; }
      66%, 76.5% { opacity: 1; }
      77%, 100% { opacity: 0; }
    }
    .score-frame-6 { animation: scoreStep6 8s step-end infinite; }
    @keyframes scoreStep7 {
      0%, 76.5% { opacity: 0; }
      77%, 94.5% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }
    .score-frame-7 { animation: scoreStep7 8s step-end infinite; }
  </style>

  <rect width="860" height="150" rx="16" fill="#0d0b18" stroke="#2e264d" stroke-width="1.5"/>

  <line x1="28" y1="48" x2="832" y2="48" stroke="#a277ff" stroke-width="2.5" class="laser-border"/>
  <line x1="28" y1="118" x2="832" y2="118" stroke="#61ffca" stroke-width="2.5" class="laser-border"/>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="700">
    <text x="32" y="30" fill="#ffca85">ARCADE // BUG HUNTER LIVE</text>
    <text x="380" y="30" fill="#a29ec4">SCORE:</text>
    <text x="455" y="30" fill="#61ffca" class="score-frame-0">000,100 PTS</text>
    <text x="455" y="30" fill="#61ffca" class="score-frame-1">000,300 PTS</text>
    <text x="455" y="30" fill="#61ffca" class="score-frame-2">000,600 PTS</text>
    <text x="455" y="30" fill="#61ffca" class="score-frame-3">000,900 PTS</text>
    <text x="455" y="30" fill="#61ffca" class="score-frame-4">001,400 PTS</text>
    <text x="455" y="30" fill="#61ffca" class="score-frame-5">002,400 PTS</text>
    <text x="455" y="30" fill="#61ffca" class="score-frame-6">003,900 PTS</text>
    <text x="455" y="30" fill="#61ffca" class="score-frame-7">005,400 PTS</text>
    
    <text x="665" y="30" fill="#f694ff">COMBO: +500 PER BUG</text>
  </g>

  <!-- Pellets that disappear when Pac-Man eats them -->
  <g>
    <circle cx="140" cy="84" r="5" fill="#ffca85" class="pellet-0"/>
    <circle cx="200" cy="84" r="5" fill="#ffca85" class="pellet-1"/>
    <circle cx="260" cy="84" r="5" fill="#ffca85" class="pellet-2"/>
    <circle cx="320" cy="84" r="5" fill="#ffca85" class="pellet-3"/>
    <circle cx="380" cy="84" r="5" fill="#ffca85" class="pellet-4"/>
    <circle cx="440" cy="84" r="5" fill="#ffca85" class="pellet-5"/>
    <circle cx="500" cy="84" r="5" fill="#ffca85" class="pellet-6"/>
    <circle cx="560" cy="84" r="5" fill="#ffca85" class="pellet-7"/>
    
  </g>

  <!-- Ghosts that get eaten and pop +500 -->
  
  <g transform="translate(605, 68)">
    <g class="ghost-wrap-0">
      <path d="M 0 28 L 0 12 A 14 14 0 0 1 28 12 L 28 28 L 23 23 L 18 28 L 14 23 L 9 28 L 4 23 Z" fill="#ff6767"/>
      <circle cx="9" cy="12" r="3" fill="#ffffff"/><circle cx="10" cy="12" r="1.5" fill="#0d0b18"/>
      <circle cx="19" cy="12" r="3" fill="#ffffff"/><circle cx="20" cy="12" r="1.5" fill="#0d0b18"/>
      <text x="-4" y="40" fill="#ff6767" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700">NullPtr</text>
    </g>
    <text x="-2" y="14" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" class="pop-score-0">+500</text>
  </g>
  <g transform="translate(670, 68)">
    <g class="ghost-wrap-1">
      <path d="M 0 28 L 0 12 A 14 14 0 0 1 28 12 L 28 28 L 23 23 L 18 28 L 14 23 L 9 28 L 4 23 Z" fill="#f694ff"/>
      <circle cx="9" cy="12" r="3" fill="#ffffff"/><circle cx="10" cy="12" r="1.5" fill="#0d0b18"/>
      <circle cx="19" cy="12" r="3" fill="#ffffff"/><circle cx="20" cy="12" r="1.5" fill="#0d0b18"/>
      <text x="-4" y="40" fill="#f694ff" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700">MemLeak</text>
    </g>
    <text x="-2" y="14" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" class="pop-score-1">+500</text>
  </g>
  <g transform="translate(735, 68)">
    <g class="ghost-wrap-2">
      <path d="M 0 28 L 0 12 A 14 14 0 0 1 28 12 L 28 28 L 23 23 L 18 28 L 14 23 L 9 28 L 4 23 Z" fill="#61ffca"/>
      <circle cx="9" cy="12" r="3" fill="#ffffff"/><circle cx="10" cy="12" r="1.5" fill="#0d0b18"/>
      <circle cx="19" cy="12" r="3" fill="#ffffff"/><circle cx="20" cy="12" r="1.5" fill="#0d0b18"/>
      <text x="-4" y="40" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="8.5" font-weight="700">TechDebt</text>
    </g>
    <text x="-2" y="14" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" class="pop-score-2">+500</text>
  </g>

  <!-- Chomping Pac-Man -->
  <g transform="translate(70, 84)">
    <g class="pac-runner">
      <!-- Upper Jaw -->
      <g class="jaw-top">
        <path d="M -18 0 A 18 18 0 0 1 18 0 Z" fill="#ffca85"/>
        <circle cx="3" cy="-9" r="2.5" fill="#0d0b18"/>
      </g>
      <!-- Lower Jaw -->
      <g class="jaw-bot">
        <path d="M -18 0 A 18 18 0 0 0 18 0 Z" fill="#ffca85"/>
      </g>
    </g>
  </g>
</svg>