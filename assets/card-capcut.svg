<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310" width="580" height="310" role="img" aria-labelledby="ccTitle ccDesc">
  <title id="ccTitle">CapCut Auto-SRT Studio - Live Browser App</title>
  <desc id="ccDesc">Animated product card previewing CapCut Auto-SRT Studio with 9:16 mobile preview and gliding timeline playhead.</desc>

  <defs>
    <clipPath id="timelineClip">
      <rect x="134" y="132" width="408" height="108" rx="6" />
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

    @keyframes playheadGlide {
      0% { transform: translateX(0px); }
      100% { transform: translateX(350px); }
    }

    @keyframes captionHighlight {
      0%, 100% { opacity: 0.72; }
      50% { opacity: 1; }
    }

    .playhead {
      animation: playheadGlide 4.2s linear infinite;
    }

    .caption-pill {
      animation: captionHighlight 2.1s ease-in-out infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .playhead, .caption-pill { animation: none; }
    }
  </style>

  <!-- Card Shell -->
  <rect x="1" y="1" width="578" height="308" rx="16" fill="#090D16" stroke="#1E293B" stroke-width="1.5" />
  <line x1="16" y1="2" x2="564" y2="2" stroke="#F8FAFC" stroke-opacity="0.06" stroke-width="1" />

  <!-- Top Row -->
  <text x="24" y="34" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#10B981">
    04 · LIVE BROWSER STUDIO
  </text>
  <rect x="462" y="18" width="94" height="24" rx="6" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity="0.45" stroke-width="1" />
  <text x="509" y="34" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#34D399">LIVE DEMO &#x2197;</text>

  <!-- Title & Description -->
  <text x="24" y="64" class="sans" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">
    CapCut Auto-SRT Studio
  </text>
  <text x="24" y="84" class="sans" font-size="12.5" fill="#94A3B8">
    Vietnamese Subtitle Pacer, 9:16 Preview &amp; 1-Click .SRT Export
  </text>

  <!-- Miniature Studio UI -->
  <rect x="24" y="100" width="532" height="150" rx="10" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
  <line x1="24" y1="122" x2="556" y2="122" stroke="#1E293B" stroke-width="1" />
  <circle cx="38" cy="111" r="3" fill="#334155" />
  <circle cx="49" cy="111" r="3" fill="#334155" />
  <circle cx="60" cy="111" r="3" fill="#334155" />
  <text x="76" y="114" class="mono" font-size="10" fill="#64748B">quoctuan364.github.io/capcut-srt-studio</text>
  <text x="542" y="114" text-anchor="end" class="mono" font-size="9.5" fill="#34D399">175 WPM · 6 WORDS</text>

  <!-- Left 9:16 Mobile Preview -->
  <rect x="38" y="132" width="76" height="108" rx="8" fill="#090D16" stroke="#283548" stroke-width="1" />
  <rect x="64" y="137" width="24" height="3" rx="1.5" fill="#1E293B" />
  <rect x="46" y="148" width="60" height="52" rx="4" fill="#131C2E" />
  <rect x="46" y="208" width="60" height="20" rx="4" fill="#10B981" fill-opacity="0.16" stroke="#10B981" stroke-opacity="0.4" stroke-width="1" class="caption-pill" />
  <text x="76" y="221" text-anchor="middle" class="mono" font-size="8.5" font-weight="700" fill="#34D399">9:16 LIVE</text>

  <!-- Right Timeline Tracks & Playhead -->
  <g clip-path="url(#timelineClip)">
    <rect x="134" y="132" width="408" height="108" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1" />
    <!-- Timecode ruler -->
    <line x1="134" y1="152" x2="542" y2="152" stroke="#1E293B" stroke-width="1" />
    <text x="144" y="145" class="mono" font-size="8.5" fill="#64748B">00:00.0</text>
    <text x="266" y="145" class="mono" font-size="8.5" fill="#64748B">00:03.0</text>
    <text x="388" y="145" class="mono" font-size="8.5" fill="#64748B">00:06.0</text>
    <text x="498" y="145" class="mono" font-size="8.5" fill="#64748B">00:09.0</text>

    <!-- Subtitle Blocks Track 1 -->
    <rect x="144" y="162" width="118" height="26" rx="5" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.45" stroke-width="1" />
    <text x="154" y="179" class="mono" font-size="9.5" font-weight="600" fill="#34D399">01 · Viral Hook (3s)</text>

    <rect x="270" y="162" width="132" height="26" rx="5" fill="#131C2E" stroke="#283548" stroke-width="1" />
    <text x="280" y="179" class="mono" font-size="9.5" fill="#CBD5E1">02 · Smart Pacing</text>

    <rect x="410" y="162" width="120" height="26" rx="5" fill="#131C2E" stroke="#283548" stroke-width="1" />
    <text x="420" y="179" class="mono" font-size="9.5" fill="#CBD5E1">03 · Export .SRT</text>

    <!-- Audio / TTS Track 2 -->
    <rect x="144" y="198" width="386" height="26" rx="5" fill="#131C2E" stroke="#1E293B" stroke-width="1" />
    <text x="154" y="215" class="mono" font-size="9.5" fill="#94A3B8">TTS + Teleprompter Mirror · 100% Client-Side</text>

    <!-- Gliding Playhead -->
    <g class="playhead">
      <polygon points="146,133 156,133 151,140" fill="#10B981" />
      <line x1="151" y1="138" x2="151" y2="238" stroke="#10B981" stroke-width="1.5" />
    </g>
  </g>

  <!-- Bottom Tech Pills -->
  <g>
    <rect x="24" y="268" width="88" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="68" y="284" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">JavaScript</text>

    <rect x="120" y="268" width="66" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="153" y="284" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">HTML5</text>

    <rect x="194" y="268" width="112" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="250" y="284" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">Web Speech API</text>

    <rect x="314" y="268" width="100" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="364" y="284" text-anchor="middle" class="mono" font-size="10" fill="#34D399">GitHub Pages</text>
  </g>
</svg>
