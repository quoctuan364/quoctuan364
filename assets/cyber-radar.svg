<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-label="Aura Cyber Radar &amp; Live Audio Deck">
  <style>
    .radar-sweep { animation: spinSweep 4.5s linear infinite; transform-origin: 135px 118px; }
    .blip-1 { animation: blipPing 2.4s ease-in-out infinite; }
    .blip-2 { animation: blipPing 2.4s ease-in-out 1.2s infinite; }
    .wave-line { stroke-dasharray: 280 60; animation: waveFlow 3.8s linear infinite; }
    .bar-a { animation: eqJump 0.55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .bar-b { animation: eqJump 0.8s ease-in-out 0.15s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .bar-c { animation: eqJump 0.48s ease-in-out 0.3s infinite alternate; transform-box: fill-box; transform-origin: bottom; }
    .bar-d { animation: eqJump 0.9s ease-in-out 0.45s infinite alternate; transform-box: fill-box; transform-origin: bottom; }

    @keyframes spinSweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes blipPing { 0%, 100% { opacity: 0.25; r: 3px; } 50% { opacity: 1; r: 6px; } }
    @keyframes waveFlow { from { stroke-dashoffset: 340; } to { stroke-dashoffset: 0; } }
    @keyframes eqJump { 0% { transform: scaleY(0.22); } 100% { transform: scaleY(1); } }
  </style>

  <defs>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#61ffca" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a277ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#61ffca"/>
      <stop offset="50%" stop-color="#a277ff"/>
      <stop offset="100%" stop-color="#f694ff"/>
    </linearGradient>
  </defs>

  <rect width="860" height="220" rx="16" fill="#0d0b18" stroke="#2e264d" stroke-width="1.5"/>

  <!-- PANEL 1: AURA RADAR -->
  <rect x="18" y="16" width="234" height="188" rx="12" fill="#141124" stroke="#2e264d"/>
  <text x="34" y="38" fill="#a277ff" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1">RADAR // AURA SCAN</text>

  <circle cx="135" cy="118" r="64" fill="#0b0914" stroke="#2e264d" stroke-width="1.2"/>
  <circle cx="135" cy="118" r="44" fill="none" stroke="#2e264d" stroke-dasharray="3 3"/>
  <circle cx="135" cy="118" r="22" fill="none" stroke="#2e264d"/>
  <line x1="71" y1="118" x2="199" y2="118" stroke="#2e264d"/>
  <line x1="135" y1="54" x2="135" y2="182" stroke="#2e264d"/>

  <g class="radar-sweep">
    <path d="M 135 118 L 135 54 A 64 64 0 0 1 190 86 Z" fill="url(#sweepGrad)"/>
    <line x1="135" y1="118" x2="135" y2="54" stroke="#61ffca" stroke-width="2"/>
  </g>

  <circle cx="158" cy="88" r="4.5" fill="#61ffca" class="blip-1"/>
  <circle cx="106" cy="138" r="4.5" fill="#f694ff" class="blip-2"/>
  <circle cx="135" cy="118" r="3.5" fill="#ffca85"/>

  <!-- PANEL 2: AURA SPECTRUM -->
  <rect x="266" y="16" width="318" height="188" rx="12" fill="#141124" stroke="#2e264d"/>
  <text x="284" y="38" fill="#61ffca" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700" letter-spacing="1">SPECTRUM // SYNTH FLOW</text>
  <text x="515" y="38" fill="#f694ff" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">128 BPM</text>

  <path d="M 284 82 Q 315 48, 345 82 T 405 82 T 465 82 T 525 82 T 565 82" fill="none" stroke="#61ffca" stroke-width="2.2" class="wave-line"/>
  <path d="M 284 82 Q 315 112, 345 82 T 405 82 T 465 82 T 525 82 T 565 82" fill="none" stroke="#a277ff" stroke-width="1.4" opacity="0.6" class="wave-line"/>

  <g fill="url(#barGrad)">
    <rect x="286" y="122" width="9" height="62" rx="3" class="bar-a"/>
    <rect x="302" y="110" width="9" height="74" rx="3" class="bar-b"/>
    <rect x="318" y="130" width="9" height="54" rx="3" class="bar-c"/>
    <rect x="334" y="104" width="9" height="80" rx="3" class="bar-d"/>
    <rect x="350" y="118" width="9" height="66" rx="3" class="bar-a"/>
    <rect x="366" y="126" width="9" height="58" rx="3" class="bar-c"/>
    <rect x="382" y="102" width="9" height="82" rx="3" class="bar-b"/>
    <rect x="398" y="116" width="9" height="68" rx="3" class="bar-d"/>
    <rect x="414" y="128" width="9" height="56" rx="3" class="bar-a"/>
    <rect x="430" y="108" width="9" height="76" rx="3" class="bar-c"/>
    <rect x="446" y="120" width="9" height="64" rx="3" class="bar-b"/>
    <rect x="462" y="106" width="9" height="78" rx="3" class="bar-d"/>
    <rect x="478" y="124" width="9" height="60" rx="3" class="bar-a"/>
    <rect x="494" y="112" width="9" height="72" rx="3" class="bar-b"/>
    <rect x="510" y="132" width="9" height="52" rx="3" class="bar-c"/>
    <rect x="526" y="114" width="9" height="70" rx="3" class="bar-d"/>
    <rect x="542" y="122" width="9" height="62" rx="3" class="bar-a"/>
    <rect x="558" y="130" width="9" height="54" rx="3" class="bar-c"/>
  </g>

  <!-- PANEL 3: AURA TERMINAL -->
  <rect x="598" y="16" width="244" height="188" rx="12" fill="#141124" stroke="#2e264d"/>
  <circle cx="618" cy="34" r="4" fill="#ff6767"/>
  <circle cx="630" cy="34" r="4" fill="#ffca85"/>
  <circle cx="642" cy="34" r="4" fill="#61ffca"/>
  <text x="658" y="38" fill="#8e87b8" font-family="JetBrains Mono, Consolas, monospace" font-size="10" font-weight="600">aura-shell — zsh</text>

  <g font-family="JetBrains Mono, Consolas, monospace" font-size="11">
    <text x="614" y="68" fill="#8e87b8">$ whoami</text>
    <text x="614" y="86" fill="#61ffca" font-weight="700">&gt; quoctuan364</text>

    <text x="614" y="112" fill="#8e87b8">$ theme --status</text>
    <text x="614" y="130" fill="#a277ff">&gt; Palette  : Aura Dark</text>
    <text x="614" y="148" fill="#f694ff">&gt; Energy   : 100% Flow</text>
    <text x="614" y="166" fill="#ffca85">&gt; Quality  : Zero Bugs</text>
    <text x="614" y="188" fill="#61ffca" font-weight="700">$ shipping_magic... █</text>
  </g>
</svg>