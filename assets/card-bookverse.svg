<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 310" width="580" height="310" role="img" aria-labelledby="bvTitle bvDesc">
  <title id="bvTitle">BookVerse AI - Full-Stack Web and Mobile RAG Platform</title>
  <desc id="bvDesc">Animated product card previewing BookVerse AI with semantic pgvector search sweep and multi-role e-book reader interface.</desc>

  <defs>
    <linearGradient id="ragSweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </linearGradient>

    <clipPath id="resultClip">
      <rect x="166" y="164" width="374" height="74" rx="6" />
    </clipPath>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }

    @keyframes queryCursor {
      0%, 48% { opacity: 1; }
      52%, 100% { opacity: 0.15; }
    }

    @keyframes vectorSweep {
      0% { transform: translateX(-140px); }
      100% { transform: translateX(420px); }
    }

    @keyframes matchPulse {
      0%, 100% { opacity: 0.65; }
      50% { opacity: 1; }
    }

    .cursor { animation: queryCursor 1.1s steps(2, start) infinite; }
    .rag-beam { animation: vectorSweep 3.8s ease-in-out infinite; }
    .match-badge { animation: matchPulse 2.6s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .cursor, .rag-beam, .match-badge { animation: none; }
      .rag-beam { opacity: 0; }
    }
  </style>

  <!-- Card Shell -->
  <rect x="1" y="1" width="578" height="308" rx="16" fill="#090D16" stroke="#1E293B" stroke-width="1.5" />
  <line x1="16" y1="2" x2="564" y2="2" stroke="#F8FAFC" stroke-opacity="0.06" stroke-width="1" />

  <!-- Top Row -->
  <text x="24" y="34" class="mono" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#10B981">
    01 · FULL-STACK &amp; RAG PLATFORM
  </text>
  <rect x="462" y="18" width="94" height="24" rx="6" fill="#0F1623" stroke="#283548" stroke-width="1" />
  <text x="509" y="34" text-anchor="middle" class="mono" font-size="10" font-weight="600" fill="#CBD5E1">OPEN REPO &#x2197;</text>

  <!-- Title & Description -->
  <text x="24" y="64" class="sans" font-size="22" font-weight="800" letter-spacing="-0.5" fill="#F8FAFC">
    BookVerse AI
  </text>
  <text x="24" y="84" class="sans" font-size="12.5" fill="#94A3B8">
    Smart Bookstore, Online E-Book Reader &amp; pgvector Semantic Search
  </text>

  <!-- Miniature App UI Mockup -->
  <rect x="24" y="100" width="532" height="150" rx="10" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
  <!-- Window Chrome -->
  <line x1="24" y1="122" x2="556" y2="122" stroke="#1E293B" stroke-width="1" />
  <circle cx="38" cy="111" r="3" fill="#334155" />
  <circle cx="49" cy="111" r="3" fill="#334155" />
  <circle cx="60" cy="111" r="3" fill="#334155" />
  <text x="76" y="114" class="mono" font-size="10" fill="#64748B">bookverse.ai / rag-assistant</text>
  <text x="542" y="114" text-anchor="end" class="mono" font-size="9.5" fill="#10B981">PGVECTOR READY</text>

  <!-- Mini Sidebar -->
  <line x1="152" y1="122" x2="152" y2="250" stroke="#1E293B" stroke-width="1" />
  <rect x="34" y="134" width="106" height="22" rx="5" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.35" stroke-width="1" />
  <text x="44" y="149" class="mono" font-size="10" font-weight="600" fill="#34D399">RAG Search</text>
  <text x="44" y="176" class="mono" font-size="10" fill="#94A3B8">Ebook Reader</text>
  <text x="44" y="198" class="mono" font-size="10" fill="#64748B">Seller Center</text>
  <text x="44" y="220" class="mono" font-size="10" fill="#64748B">Admin Audit</text>

  <!-- Search Input Bar -->
  <rect x="166" y="132" width="374" height="26" rx="6" fill="#090D16" stroke="#283548" stroke-width="1" />
  <text x="178" y="149" class="mono" font-size="10.5" fill="#CBD5E1">
    <tspan fill="#10B981">&gt;</tspan> "designing distributed web systems"
  </text>
  <rect x="430" y="138" width="6" height="13" rx="1" fill="#10B981" class="cursor" />

  <!-- Semantic Match Rows with Animated Vector Sweep -->
  <g clip-path="url(#resultClip)">
    <rect x="166" y="166" width="374" height="32" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1" />
    <text x="178" y="186" class="sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Designing Data-Intensive Apps</text>
    <rect x="454" y="173" width="76" height="18" rx="4" fill="#10B981" fill-opacity="0.14" class="match-badge" />
    <text x="492" y="186" text-anchor="middle" class="mono" font-size="9.5" font-weight="700" fill="#34D399">VECTOR HIT</text>

    <rect x="166" y="204" width="374" height="32" rx="6" fill="#090D16" stroke="#1E293B" stroke-width="1" />
    <text x="178" y="224" class="sans" font-size="11.5" font-weight="500" fill="#94A3B8">Hybrid Recommender · Content + Behavior</text>
    <rect x="466" y="211" width="64" height="18" rx="4" fill="#131C2E" stroke="#283548" stroke-width="1" />
    <text x="498" y="224" text-anchor="middle" class="mono" font-size="9.5" fill="#38BDF8">FASTAPI</text>

    <rect x="166" y="164" width="120" height="76" fill="url(#ragSweep)" class="rag-beam" />
  </g>

  <!-- Bottom Tech Pills -->
  <g>
    <rect x="24" y="268" width="84" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="66" y="284" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">Next.js 15</text>

    <rect x="116" y="268" width="88" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="160" y="284" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">TypeScript</text>

    <rect x="212" y="268" width="74" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="249" y="284" text-anchor="middle" class="mono" font-size="10" fill="#CBD5E1">FastAPI</text>

    <rect x="294" y="268" width="112" height="24" rx="6" fill="#0F1623" stroke="#1E293B" stroke-width="1" />
    <text x="350" y="284" text-anchor="middle" class="mono" font-size="10" fill="#34D399">PostgreSQL · RAG</text>
  </g>
</svg>
