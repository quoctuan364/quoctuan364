<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Quốc Tuấn — Full-Stack &amp; AI Systems Engineer</title>
  <desc id="desc">Interactive Command Center Banner for quoctuan364 GitHub Profile</desc>
  <style>
    .pulse { animation: pulse 3s ease-in-out infinite; }
    .float-slow { animation: floatSlow 6s ease-in-out infinite; }
    .float-rev { animation: floatRev 7s ease-in-out infinite; }
    .dash { stroke-dasharray: 8 6; animation: dashMove 18s linear infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }
    @keyframes floatRev { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(6px); } }
    @keyframes dashMove { to { stroke-dashoffset: -140; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060911"/>
      <stop offset="55%" stop-color="#0d1324"/>
      <stop offset="100%" stop-color="#080c17"/>
    </linearGradient>
    <radialGradient id="glowIndigo" cx="78%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="22%" cy="85%" r="42%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131c31" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#0b101d" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#64748b" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background & Grid -->
  <rect width="1200" height="460" rx="22" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="460" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="460" rx="22" fill="url(#glowIndigo)"/>
  <rect width="1200" height="460" rx="22" fill="url(#glowCyan)"/>

  <!-- Top System Telemetry Bar -->
  <g font-family="JetBrains Mono, Consolas, monospace" font-size="12">
    <rect x="36" y="24" width="1128" height="36" rx="8" fill="#0b101c" stroke="#1e293b"/>
    <circle cx="56" cy="42" r="5" fill="#10b981" class="pulse"/>
    <text x="70" y="46" fill="#10b981" font-weight="700">SYS.ONLINE</text>
    <text x="160" y="46" fill="#475569">|</text>
    <text x="178" y="46" fill="#cbd5e1">NODE: <tspan fill="#38bdf8">QUOCTUAN364-CORE</tspan></text>
    <text x="372" y="46" fill="#475569">|</text>
    <text x="390" y="46" fill="#cbd5e1">FOCUS: <tspan fill="#a5b4fc">FULL-STACK WEB · MOBILE · MULTI-AGENT AI · LLM SECURITY</tspan></text>
    <rect x="1032" y="31" width="120" height="22" rx="4" fill="#131c31" stroke="#334155"/>
    <text x="1046" y="46" fill="#34d399" font-size="11" font-weight="700">ACTIVE BUILD</text>
  </g>

  <!-- Left Column: Identity & Core Engineering Pillars -->
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <rect x="44" y="88" width="190" height="26" rx="5" fill="#111a2e" stroke="#3b82f6" stroke-opacity="0.4"/>
    <text x="58" y="105" fill="#60a5fa" font-family="JetBrains Mono, monospace" font-size="11.5" font-weight="700" letter-spacing="1.5">SOFTWARE ARCHITECT</text>

    <text x="44" y="176" fill="url(#titleGrad)" font-size="64" font-weight="800" letter-spacing="-1.5">Quốc Tuấn.</text>
    <text x="46" y="218" fill="url(#accentGrad)" font-size="25" font-weight="700">Full-Stack Engineer &amp; AI Product Builder</text>
    <text x="46" y="252" fill="#94a3b8" font-size="15.5">Xây dựng hệ thống Web/Mobile hiệu năng cao, kiến trúc Multi-Agent AI</text>
    <text x="46" y="274" fill="#94a3b8" font-size="15.5">và cổng bảo mật mô hình ngôn ngữ lớn (LLM Security &amp; RAG Systems).</text>

    <!-- 4 Engineering Domain Pills -->
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="700">
      <rect x="44" y="302" width="136" height="34" rx="7" fill="#111827" stroke="#334155"/>
      <text x="61" y="323" fill="#38bdf8">[01] WEB &amp; APP</text>

      <rect x="190" y="302" width="150" height="34" rx="7" fill="#111827" stroke="#334155"/>
      <text x="206" y="323" fill="#a5b4fc">[02] AI AGENTS</text>

      <rect x="350" y="302" width="160" height="34" rx="7" fill="#111827" stroke="#334155"/>
      <text x="366" y="323" fill="#34d399">[03] LLM SECURITY</text>

      <rect x="520" y="302" width="142" height="34" rx="7" fill="#111827" stroke="#334155"/>
      <text x="536" y="323" fill="#fbbf24">[04] DATA &amp; ML</text>
    </g>

    <!-- Bottom Tech Stack Strip -->
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" fill="#64748b">
      <text x="46" y="378">STACK // <tspan fill="#cbd5e1">React · Next.js · React Native · TypeScript · Node.js · FastAPI · Python · SQLite/PostgreSQL · Docker</tspan></text>
    </g>

    <!-- Quick KPI Counter Strip -->
    <g transform="translate(44, 396)" font-family="JetBrains Mono, Consolas, monospace">
      <rect width="185" height="40" rx="6" fill="#0b101c" stroke="#1e293b"/>
      <text x="14" y="17" fill="#64748b" font-size="10">FLAGSHIP SYSTEMS</text>
      <text x="14" y="32" fill="#f8fafc" font-size="13" font-weight="700">07+ Production Repos</text>

      <rect x="198" width="195" height="40" rx="6" fill="#0b101c" stroke="#1e293b"/>
      <text x="212" y="17" fill="#64748b" font-size="10">ARCHITECTURE</text>
      <text x="212" y="32" fill="#34d399" font-size="13" font-weight="700">Full-Stack + RAG + WAL</text>

      <rect x="406" width="205" height="40" rx="6" fill="#0b101c" stroke="#1e293b"/>
      <text x="420" y="17" fill="#64748b" font-size="10">SECURITY &amp; AI</text>
      <text x="420" y="32" fill="#38bdf8" font-size="13" font-weight="700">Sentinel &amp; Multi-Agent</text>
    </g>
  </g>

  <!-- Right Column: Live Interactive Ecosystem Topology & Cards -->
  <g fill="none" stroke-width="1.5">
    <path d="M 800 135 L 1050 155" stroke="#6366f1" class="dash"/>
    <path d="M 800 135 L 800 280 L 1050 295" stroke="#06b6d4" class="dash"/>
    <path d="M 1050 155 L 800 280" stroke="#334155" stroke-dasharray="4 4"/>
  </g>

  <!-- Card 1: ChannelCorp OS -->
  <g transform="translate(695, 82)">
    <g class="float-slow">
      <rect width="230" height="106" rx="10" fill="url(#cardBg)" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="12" y="12" width="54" height="18" rx="4" fill="#1e1b4b" stroke="#6366f1"/>
      <text x="20" y="25" fill="#a5b4fc" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">NEW OS</text>
      <text x="74" y="25" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">5 AI DEPTS</text>
      <text x="14" y="50" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">ChannelCorp OS</text>
      <text x="14" y="69" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">Multi-Agent Media Agency</text>
      <text x="14" y="88" fill="#38bdf8" font-family="JetBrains Mono, monospace" font-size="10.5">Node.js · SQLite · 9 Agents</text>
    </g>
  </g>

  <!-- Card 2: MindVault Second Brain -->
  <g transform="translate(940, 102)">
    <g class="float-rev">
      <rect width="225" height="106" rx="10" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.5"/>
      <rect x="12" y="12" width="54" height="18" rx="4" fill="#083344" stroke="#06b6d4"/>
      <text x="20" y="25" fill="#67e8f9" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">GRAPH</text>
      <text x="74" y="25" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">2D PHYSICS</text>
      <text x="14" y="50" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">MindVault OS</text>
      <text x="14" y="69" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">Second Brain &amp; Wiki-Graph</text>
      <text x="14" y="88" fill="#34d399" font-family="JetBrains Mono, monospace" font-size="10.5">Zettelkasten · SQLite WAL</text>
    </g>
  </g>

  <!-- Card 3: BookVerse AI -->
  <g transform="translate(695, 222)">
    <g class="float-rev">
      <rect width="230" height="104" rx="10" fill="url(#cardBg)" stroke="#10b981" stroke-width="1.5"/>
      <rect x="12" y="12" width="48" height="18" rx="4" fill="#064e3b" stroke="#10b981"/>
      <text x="20" y="25" fill="#6ee7b7" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">RAG</text>
      <text x="68" y="25" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">WEB + MOBILE</text>
      <text x="14" y="50" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">BookVerse AI</text>
      <text x="14" y="69" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">Smart Ebook &amp; RAG Platform</text>
      <text x="14" y="88" fill="#a5b4fc" font-family="JetBrains Mono, monospace" font-size="10.5">Next.js · FastAPI · Expo</text>
    </g>
  </g>

  <!-- Card 4: Sentinel AI & LLM Security Gateway -->
  <g transform="translate(940, 240)">
    <g class="float-slow">
      <rect width="225" height="104" rx="10" fill="url(#cardBg)" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="12" y="12" width="52" height="18" rx="4" fill="#451a03" stroke="#f59e0b"/>
      <text x="19" y="25" fill="#fcd34d" font-family="JetBrains Mono, monospace" font-size="10" font-weight="700">SEC-GW</text>
      <text x="72" y="25" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="10">AI FIREWALL</text>
      <text x="14" y="50" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">Sentinel &amp; LLM Guard</text>
      <text x="14" y="69" fill="#94a3b8" font-family="Segoe UI, sans-serif" font-size="11.5">Prompt Injection Defense</text>
      <text x="14" y="88" fill="#fbbf24" font-family="JetBrains Mono, monospace" font-size="10.5">Python · Security Gateway</text>
    </g>
  </g>

  <!-- Bottom Right Terminal Status Strip -->
  <g transform="translate(695, 368)" font-family="JetBrains Mono, Consolas, monospace" font-size="11">
    <rect width="470" height="68" rx="8" fill="#090d16" stroke="#1e293b"/>
    <text x="16" y="24" fill="#64748b">$ agy status --ecosystem quoctuan364</text>
    <text x="16" y="43" fill="#cbd5e1">&gt; Active Pipelines: <tspan fill="#34d399">[ChannelCorp-OS]</tspan> <tspan fill="#38bdf8">[MindVault]</tspan> <tspan fill="#a5b4fc">[BookVerse-AI]</tspan></text>
    <text x="16" y="59" fill="#94a3b8">&gt; All services operational · Zero external overhead · Ready to deploy</text>
  </g>
</svg>
