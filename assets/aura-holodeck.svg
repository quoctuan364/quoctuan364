<svg xmlns="http://www.w3.org/2000/svg" width="860" height="285" viewBox="0 0 860 285" role="img" aria-label="Interactive Aura Holo-Cube &amp; Synth Piano Deck">
  <style>
    /* ===================================================================== */
    /* 1. INTERACTIVE 3D ISOMETRIC HOLO-CUBE (LEFT PANEL)                    */
    /* ===================================================================== */
    .cube-assembly {
      animation: cubeFloat 4.5s ease-in-out infinite;
      cursor: pointer;
    }
    .cube-top, .cube-left, .cube-right, .cube-core {
      transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), filter 0.45s ease, opacity 0.45s ease;
    }
    /* When user hovers over the cube, it explodes outward revealing the glowing quantum core! */
    .cube-assembly:hover .cube-top {
      transform: translate(0px, -24px);
      filter: drop-shadow(0 -8px 12px rgba(97, 255, 202, 0.55));
    }
    .cube-assembly:hover .cube-left {
      transform: translate(-22px, 14px);
      filter: drop-shadow(-8px 6px 12px rgba(162, 119, 255, 0.55));
    }
    .cube-assembly:hover .cube-right {
      transform: translate(22px, 14px);
      filter: drop-shadow(8px 6px 12px rgba(246, 148, 255, 0.55));
    }
    .cube-core {
      opacity: 0.25;
      transform-origin: 155px 150px;
    }
    .cube-assembly:hover .cube-core {
      opacity: 1;
      transform: scale(1.35);
    }
    .ring-spin {
      animation: spinRing 14s linear infinite;
      transform-origin: 155px 150px;
    }

    /* ===================================================================== */
    /* 2. INTERACTIVE EVADING TARGETS (MIDDLE PANEL: "CATCH ME IF YOU CAN")  */
    /* ===================================================================== */
    .dodge-zone {
      cursor: crosshair;
    }
    .bug-target {
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), fill 0.2s ease;
    }
    /* When mouse enters the dodge slot, the target teleports away from the cursor! */
    .dodge-1:hover .bug-target { transform: translate(82px, -34px) rotate(25deg); }
    .dodge-2:hover .bug-target { transform: translate(-88px, 32px) rotate(-25deg); }
    .dodge-3:hover .bug-target { transform: translate(76px, 36px) scale(0.85); }
    .dodge-4:hover .bug-target { transform: translate(-78px, -38px) rotate(18deg); }

    .dodge-msg {
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .dodge-1:hover .dodge-msg,
    .dodge-2:hover .dodge-msg,
    .dodge-3:hover .dodge-msg,
    .dodge-4:hover .dodge-msg {
      opacity: 1;
    }

    /* ===================================================================== */
    /* 3. INTERACTIVE SYNTHWAVE PIANO & LAUNCHPAD (RIGHT PANEL)              */
    /* ===================================================================== */
    .synth-key {
      cursor: pointer;
      transition: transform 0.15s ease, fill 0.15s ease, filter 0.15s ease;
    }
    .synth-key:hover {
      transform: translateY(5px);
      fill: #61ffca;
      filter: drop-shadow(0 0 12px #61ffca);
    }
    .synth-key-alt:hover {
      transform: translateY(5px);
      fill: #f694ff;
      filter: drop-shadow(0 0 12px #f694ff);
    }
    .note-spark {
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.35s ease;
    }
    .key-wrap:hover .note-spark {
      opacity: 1;
      transform: translateY(-22px) scale(1.15);
    }

    @keyframes cubeFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes spinRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <defs>
    <linearGradient id="topFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#61ffca" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#a277ff" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="leftFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a277ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2e1d4a" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="rightFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f694ff" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#4c2882" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="quantumGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffca85" stop-opacity="1"/>
      <stop offset="50%" stop-color="#61ffca" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#a277ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Main Outer Frame -->
  <rect width="860" height="285" rx="18" fill="#0d0b18" stroke="#2e264d" stroke-width="1.5"/>

  <!-- Top Interactive Banner Header -->
  <rect x="18" y="14" width="824" height="34" rx="8" fill="#141124" stroke="#2e264d"/>
  <circle cx="36" cy="31" r="4.5" fill="#61ffca"/>
  <text x="50" y="35" fill="#edecee" font-family="JetBrains Mono, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1">INTERACTIVE AURA HOLO-DECK // HOVER YOUR MOUSE BELOW TO PLAY</text>
  <text x="665" y="35" fill="#ffca85" font-family="JetBrains Mono, Consolas, monospace" font-size="11" font-weight="700">[DIRECT SVG INTERACTION]</text>

  <!-- ===================================================================== -->
  <!-- PANEL 1: 3D HOLO-CUBE REACTOR (HOVER TO EXPLODE)                      -->
  <!-- ===================================================================== -->
  <rect x="18" y="60" width="262" height="208" rx="12" fill="#120f22" stroke="#2e264d"/>
  <text x="34" y="82" fill="#61ffca" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">01 // 3D HOLO-CUBE (HOVER ME)</text>

  <circle cx="150" cy="160" r="68" fill="none" stroke="#2e264d" stroke-width="1.2" stroke-dasharray="6 6" class="ring-spin"/>

  <g class="cube-assembly">
    <!-- Hidden Inner Quantum Core (Revealed when hovered!) -->
    <g class="cube-core">
      <circle cx="150" cy="155" r="26" fill="url(#quantumGlow)"/>
      <text x="150" y="159" text-anchor="middle" fill="#0d0b18" font-family="JetBrains Mono, monospace" font-size="9" font-weight="800">AURA CORE</text>
    </g>

    <!-- Isometric Top Face -->
    <polygon class="cube-top" points="150,105 202,132 150,159 98,132" fill="url(#topFace)" stroke="#edecee" stroke-width="1"/>
    <!-- Isometric Left Face -->
    <polygon class="cube-left" points="98,132 150,159 150,215 98,188" fill="url(#leftFace)" stroke="#a277ff" stroke-width="1"/>
    <!-- Isometric Right Face -->
    <polygon class="cube-right" points="150,159 202,132 202,188 150,215" fill="url(#rightFace)" stroke="#f694ff" stroke-width="1"/>
  </g>

  <text x="150" y="252" text-anchor="middle" fill="#8e87b8" font-family="JetBrains Mono, monospace" font-size="10">Trỏ chuột vào khối 3D để bung lõi</text>

  <!-- ===================================================================== -->
  <!-- PANEL 2: RUNAWAY BUGS ("TRỎ CHUỘT VÀO NÓ TỰ NÉ!")                     -->
  <!-- ===================================================================== -->
  <rect x="294" y="60" width="272" height="208" rx="12" fill="#120f22" stroke="#2e264d"/>
  <text x="310" y="82" fill="#f694ff" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">02 // DODGE ARENA (CATCH THE BUG)</text>

  <!-- Dodge Slot 1 -->
  <g class="dodge-zone dodge-1" transform="translate(320, 102)">
    <rect width="102" height="54" rx="8" fill="#17132b" stroke="#2e264d" stroke-dasharray="3 3"/>
    <text x="51" y="31" text-anchor="middle" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" class="dodge-msg">HỤT RỒI! 💨</text>
    <g class="bug-target">
      <rect x="14" y="12" width="74" height="30" rx="6" fill="#ff6767" stroke="#edecee" stroke-width="1"/>
      <text x="51" y="31" text-anchor="middle" fill="#0d0b18" font-family="JetBrains Mono, monospace" font-size="10" font-weight="800">BUG #01</text>
    </g>
  </g>

  <!-- Dodge Slot 2 -->
  <g class="dodge-zone dodge-2" transform="translate(442, 102)">
    <rect width="102" height="54" rx="8" fill="#17132b" stroke="#2e264d" stroke-dasharray="3 3"/>
    <text x="51" y="31" text-anchor="middle" fill="#ffca85" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" class="dodge-msg">NÉ NGAY! ⚡</text>
    <g class="bug-target">
      <rect x="14" y="12" width="74" height="30" rx="6" fill="#a277ff" stroke="#edecee" stroke-width="1"/>
      <text x="51" y="31" text-anchor="middle" fill="#0d0b18" font-family="JetBrains Mono, monospace" font-size="10" font-weight="800">BUG #02</text>
    </g>
  </g>

  <!-- Dodge Slot 3 -->
  <g class="dodge-zone dodge-3" transform="translate(320, 170)">
    <rect width="102" height="54" rx="8" fill="#17132b" stroke="#2e264d" stroke-dasharray="3 3"/>
    <text x="51" y="31" text-anchor="middle" fill="#f694ff" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" class="dodge-msg">ĐỐ BẮT ĐƯỢC</text>
    <g class="bug-target">
      <rect x="14" y="12" width="74" height="30" rx="6" fill="#61ffca" stroke="#0d0b18" stroke-width="1"/>
      <text x="51" y="31" text-anchor="middle" fill="#0d0b18" font-family="JetBrains Mono, monospace" font-size="10" font-weight="800">BUG #03</text>
    </g>
  </g>

  <!-- Dodge Slot 4 -->
  <g class="dodge-zone dodge-4" transform="translate(442, 170)">
    <rect width="102" height="54" rx="8" fill="#17132b" stroke="#2e264d" stroke-dasharray="3 3"/>
    <text x="51" y="31" text-anchor="middle" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="9.5" font-weight="700" class="dodge-msg">QUÁ NHANH!</text>
    <g class="bug-target">
      <rect x="14" y="12" width="74" height="30" rx="6" fill="#ffca85" stroke="#0d0b18" stroke-width="1"/>
      <text x="51" y="31" text-anchor="middle" fill="#0d0b18" font-family="JetBrains Mono, monospace" font-size="10" font-weight="800">BUG #04</text>
    </g>
  </g>

  <text x="430" y="252" text-anchor="middle" fill="#8e87b8" font-family="JetBrains Mono, monospace" font-size="10">Đưa chuột vào bắt thử 4 con Bug!</text>

  <!-- ===================================================================== -->
  <!-- PANEL 3: SYNTHWAVE PIANO KEYS (HOVER TO PLAY CHORDS)                  -->
  <!-- ===================================================================== -->
  <rect x="580" y="60" width="262" height="208" rx="12" fill="#120f22" stroke="#2e264d"/>
  <text x="596" y="82" fill="#ffca85" font-family="JetBrains Mono, Consolas, monospace" font-size="10.5" font-weight="700">03 // SYNTH KEYS (GLIDE MOUSE)</text>

  <!-- 7 Interactive Synth Keys -->
  <g transform="translate(600, 122)">
    <g class="key-wrap" transform="translate(0, 0)">
      <text x="14" y="-6" text-anchor="middle" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" class="note-spark">♪ C4</text>
      <rect width="28" height="96" rx="5" fill="#1e1936" stroke="#a277ff" stroke-width="1.4" class="synth-key"/>
    </g>
    <g class="key-wrap" transform="translate(33, 0)">
      <text x="14" y="-6" text-anchor="middle" fill="#f694ff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" class="note-spark">♫ D4</text>
      <rect width="28" height="96" rx="5" fill="#1e1936" stroke="#a277ff" stroke-width="1.4" class="synth-key-alt"/>
    </g>
    <g class="key-wrap" transform="translate(66, 0)">
      <text x="14" y="-6" text-anchor="middle" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" class="note-spark">♪ E4</text>
      <rect width="28" height="96" rx="5" fill="#1e1936" stroke="#a277ff" stroke-width="1.4" class="synth-key"/>
    </g>
    <g class="key-wrap" transform="translate(99, 0)">
      <text x="14" y="-6" text-anchor="middle" fill="#ffca85" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" class="note-spark">♬ F4</text>
      <rect width="28" height="96" rx="5" fill="#1e1936" stroke="#a277ff" stroke-width="1.4" class="synth-key-alt"/>
    </g>
    <g class="key-wrap" transform="translate(132, 0)">
      <text x="14" y="-6" text-anchor="middle" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" class="note-spark">♪ G4</text>
      <rect width="28" height="96" rx="5" fill="#1e1936" stroke="#a277ff" stroke-width="1.4" class="synth-key"/>
    </g>
    <g class="key-wrap" transform="translate(165, 0)">
      <text x="14" y="-6" text-anchor="middle" fill="#f694ff" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" class="note-spark">♫ A4</text>
      <rect width="28" height="96" rx="5" fill="#1e1936" stroke="#a277ff" stroke-width="1.4" class="synth-key-alt"/>
    </g>
    <g class="key-wrap" transform="translate(198, 0)">
      <text x="14" y="-6" text-anchor="middle" fill="#61ffca" font-family="JetBrains Mono, monospace" font-size="11" font-weight="800" class="note-spark">♪ B4</text>
      <rect width="28" height="96" rx="5" fill="#1e1936" stroke="#a277ff" stroke-width="1.4" class="synth-key"/>
    </g>
  </g>

  <text x="711" y="252" text-anchor="middle" fill="#8e87b8" font-family="JetBrains Mono, monospace" font-size="10">Lướt chuột qua phím đàn để đánh nhạc</text>
</svg>
